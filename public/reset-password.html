<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial;
        }

        .reset-card {
            width: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 40px;
            color: #0d6efd;
        }
    </style>

</head>

<body>

    <div class="card reset-card">

        <div class="card-body p-4">

            <div class="text-center mb-4">
                <i class="fas fa-lock icon"></i>
                <h4 class="mt-2">Reset Password</h4>
                <p class="text-muted">Enter your new password</p>
            </div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter new password">
            </div>

            <div class="d-grid">
                <button class="btn btn-primary" onclick="resetPassword()">
                    <i class="fas fa-key me-1"></i>Reset Password
                </button>
            </div>

            <div class="text-center mt-3">
                <a href="/" class="text-decoration-none">Back to Login</a>
            </div>

        </div>

    </div>

    <script>

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        async function resetPassword() {

            const password = document.getElementById("password").value;

            if (!password) {
                alert("Enter password");
                return;
            }

            const res = await fetch(`/api/auth/reset-password/${token}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ password })
            });

            const data = await res.json();

            alert(data.message);

            if (res.ok) {
                window.location.href = "/";
            }

        }

    </script>

</body>

</html>
